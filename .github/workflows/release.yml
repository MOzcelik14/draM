name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: Resolve Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            VER="${TAG#v}"
          else
            VER="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
            TAG="v${VER}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  linux:
    name: Package Linux (tar.gz + deb + rpm + AppImage)
    needs: meta
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libx11-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libwayland-dev \
            rpm \
            libfuse2 \
            file \
            curl
          curl -fsSL -o /tmp/appimagetool-x86_64.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool-x86_64.AppImage
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked -p dram-app
      - name: Package Linux artifacts
        run: bash scripts/package-linux.sh "${{ needs.meta.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dram-linux-package
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Package Windows (zip)
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build Windows release binary
        run: cargo build --release --locked -p dram-app
      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $ver = "${{ needs.meta.outputs.version }}"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $stage = Join-Path $env:TEMP "dram-stage"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          Copy-Item -Path "target\release\dram.exe" -Destination $stage -Force
          Copy-Item -Path "locales" -Destination $stage -Recurse -Force
          Copy-Item -Path "README.md" -Destination $stage -Force
          Copy-Item -Path "FORMAT.md" -Destination $stage -Force
          Copy-Item -Path "assets\logo-mark.svg" -Destination (Join-Path $stage "dram.svg") -Force

          Compress-Archive -Path "$stage\*" -DestinationPath "dist\draM-$ver-windows-x86_64.zip" -Force
          Remove-Item -Recurse -Force $stage
      - uses: actions/upload-artifact@v4
        with:
          name: dram-windows-package
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  macos:
    name: Package macOS (dmg + tar.gz)
    needs: meta
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build macOS release binary
        run: cargo build --release --locked -p dram-app
      - name: Package macOS dmg and tar.gz
        run: |
          set -euo pipefail
          VER="${{ needs.meta.outputs.version }}"
          mkdir -p dist

          STAGE="$(mktemp -d)"
          PKG="${STAGE}/draM-${VER}-macos-$(uname -m)"
          mkdir -p "${PKG}/locales"
          cp target/release/dram "${PKG}/dram"
          cp -r locales/* "${PKG}/locales/"
          cp README.md FORMAT.md "${PKG}/"
          cp assets/logo-mark.svg "${PKG}/dram.svg"
          tar -C "${STAGE}" -czf "dist/draM-${VER}-macos-$(uname -m).tar.gz" "draM-${VER}-macos-$(uname -m)"
          rm -rf "${STAGE}"

          DMG_STAGE="$(mktemp -d)"
          APP_DIR="${DMG_STAGE}/draM..app"
          mkdir -p "${APP_DIR}/Contents/MacOS" "${APP_DIR}/Contents/Resources/locales"
          cp target/release/dram "${APP_DIR}/Contents/MacOS/dram"
          chmod +x "${APP_DIR}/Contents/MacOS/dram"
          cp -r locales/* "${APP_DIR}/Contents/Resources/locales/"

          cat > "${APP_DIR}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>dram</string>
            <key>CFBundleIdentifier</key><string>com.mozcelik14.dram</string>
            <key>CFBundleName</key><string>draM.</string>
            <key>CFBundleVersion</key><string>${VER}</string>
            <key>CFBundleShortVersionString</key><string>${VER}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          ln -s /Applications "${DMG_STAGE}/Applications"

          if [[ -n "${APPLE_CERTIFICATE_BASE64:-}" && -n "${APPLE_CERTIFICATE_PASSWORD:-}" && -n "${APPLE_SIGNING_IDENTITY:-}" ]]; then
            KEYCHAIN_PATH="${RUNNER_TEMP}/dram-signing.keychain-db"
            KEYCHAIN_PASS="$(uuidgen)"
            CERT_PATH="${RUNNER_TEMP}/dram-cert.p12"
            echo "${APPLE_CERTIFICATE_BASE64}" | base64 --decode > "${CERT_PATH}"
            security create-keychain -p "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
            security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
            security unlock-keychain -p "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
            security import "${CERT_PATH}" -P "${APPLE_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
            security list-keychains -d user -s "${KEYCHAIN_PATH}"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"

            codesign --deep --force --options runtime --timestamp --sign "${APPLE_SIGNING_IDENTITY}" "${APP_DIR}"
            codesign --verify --deep --strict --verbose=2 "${APP_DIR}"
          else
            echo "::notice::Apple Developer ID signing secrets not configured; skipping .app codesign."
          fi

          DMG_OUT="dist/draM-${VER}-macos-$(uname -m).dmg"
          hdiutil create -volname "draM. ${VER}" -srcfolder "${DMG_STAGE}" -ov -format UDZO "${DMG_OUT}"
          rm -rf "${DMG_STAGE}"

          if [[ -n "${APPLE_SIGNING_IDENTITY:-}" && -n "${APPLE_CERTIFICATE_BASE64:-}" ]]; then
            codesign --force --timestamp --sign "${APPLE_SIGNING_IDENTITY}" "${DMG_OUT}"
            if [[ -n "${APPLE_ID:-}" && -n "${APPLE_TEAM_ID:-}" && -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]]; then
              xcrun notarytool submit "${DMG_OUT}" \
                --apple-id "${APPLE_ID}" \
                --team-id "${APPLE_TEAM_ID}" \
                --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
                --wait
              xcrun stapler staple "${DMG_OUT}"
            else
              echo "::notice::Apple notarization credentials not configured; skipping xcrun notarytool."
            fi
          fi
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: dram-macos-package
          path: |
            dist/*.dmg
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: [meta, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dram-*-package*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum -- *.deb *.rpm *.AppImage *.dmg *.tar.gz *.zip > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.dmg
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
