name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: Resolve Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            VER="${TAG#v}"
          else
            VER="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
            TAG="v${VER}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  linux:
    name: Package Linux (tar.gz + deb)
    needs: meta
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libx11-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked -p dram-app
      - name: Package Linux artifacts
        run: bash scripts/package-linux.sh "${{ needs.meta.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dram-linux-package
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Package Windows (zip)
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build Windows release binary
        run: cargo build --release --locked -p dram-app
      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $ver = "${{ needs.meta.outputs.version }}"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $stage = Join-Path $env:TEMP "dram-stage"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          Copy-Item -Path "target\release\dram.exe" -Destination $stage -Force
          Copy-Item -Path "locales" -Destination $stage -Recurse -Force
          Copy-Item -Path "README.md" -Destination $stage -Force
          Copy-Item -Path "FORMAT.md" -Destination $stage -Force
          Copy-Item -Path "assets\logo-mark.svg" -Destination (Join-Path $stage "dram.svg") -Force

          Compress-Archive -Path "$stage\*" -DestinationPath "dist\draM-$ver-windows-x86_64.zip" -Force
          Remove-Item -Recurse -Force $stage
      - uses: actions/upload-artifact@v4
        with:
          name: dram-windows-package
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  macos:
    name: Package macOS (tar.gz)
    needs: meta
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build macOS release binary
        run: cargo build --release --locked -p dram-app
      - name: Package macOS archive
        run: |
          VER="${{ needs.meta.outputs.version }}"
          mkdir -p dist
          STAGE="$(mktemp -d)"
          PKG="${STAGE}/draM-${VER}-macos-$(uname -m)"
          mkdir -p "${PKG}/locales"
          cp target/release/dram "${PKG}/dram"
          cp -r locales/* "${PKG}/locales/"
          cp README.md FORMAT.md "${PKG}/"
          cp assets/logo-mark.svg "${PKG}/dram.svg"
          tar -C "${STAGE}" -czf "dist/draM-${VER}-macos-$(uname -m).tar.gz" "draM-${VER}-macos-$(uname -m)"
          rm -rf "${STAGE}"
      - uses: actions/upload-artifact@v4
        with:
          name: dram-macos-package
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: [meta, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dram-*-package*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum -- *.deb *.tar.gz *.zip > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
