[workspace]
resolver = "2"
members = [
    "crates/dram-core",
    "crates/dram-format",
    "crates/dram-pdf",
    "crates/dram-print",
    "crates/dram-app",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["draM. Contributors"]
repository = "https://github.com/MOzcelik14/draM"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
unicode-segmentation = "1.12"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
fluent-bundle = "0.15"
unic-langid = "0.9"
sys-locale = "0.3"
eframe = "0.31"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
krilla = "0.8"
ttf-parser = "0.25"
quick-xml = "0.37"
