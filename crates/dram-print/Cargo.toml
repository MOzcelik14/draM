[package]
name = "dram-print"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cross-platform PDF-based printing handoff for draM."

[lints]
workspace = true

[dependencies]
dram-core = { path = "../dram-core" }
dram-pdf = { path = "../dram-pdf" }
thiserror = { workspace = true }
uuid = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
